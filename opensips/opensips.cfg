###############################################################################
# OpenSIPS front for a bring-your-own-carrier -> Daily/Pipecat call flow.
#
#   carrier INVITE  ->  this proxy  ->  Daily SIP dial-in URI   (leg 1, inbound)
#   Daily dial-out  ->  this proxy  ->  carrier                 (leg 2, transfer)
#
# Replace every value in the defines block, then:
#   opensips -C -f /etc/opensips/opensips.cfg && systemctl restart opensips
###############################################################################

#!define LISTEN_IP        "203.0.113.10"          # public IP of this host
#!define CARRIER_IP       "198.51.100.20"         # carrier SIP edge (signalling peer)
#!define CARRIER_HOST     "carrier.example"       # carrier SIP domain / realm
#!define TRUNK_USER       "your-trunk-account"    # registered trunk account
#!define DAILY_SIP_URI    "sip:ROOM.0@PROJECT.dapp.example.com"  # Daily dial-in URI

mpath="/usr/lib/x86_64-linux-gnu/opensips/modules/"
log_level=4
stderror_enabled=yes
syslog_enabled=yes
udp_workers=2

# 5060 is often taken by another SIP stack (drachtio, asterisk, ...) -> use 5080
socket=udp:LISTEN_IP:5080
socket=udp:127.0.0.1:5080

####### Modules #########
loadmodule "proto_udp.so"
loadmodule "signaling.so"
loadmodule "sl.so"
loadmodule "tm.so"
loadmodule "rr.so"
loadmodule "maxfwd.so"
loadmodule "textops.so"
loadmodule "sipmsgops.so"
loadmodule "db_mysql.so"
loadmodule "mi_fifo.so"
loadmodule "uac.so"
loadmodule "uac_auth.so"
loadmodule "uac_registrant.so"

modparam("uac", "restore_mode", "auto")
# keeps the trunk registration alive; without it nothing inbound ever arrives
modparam("uac_registrant", "timer_interval", 10)
modparam("uac_registrant", "db_url", "mysql://opensips:__DB_PASSWORD__@localhost/opensips")
modparam("mi_fifo", "fifo_name", "/run/opensips/opensips_fifo")

####### Routing Logic #########
route {
    if (is_method("OPTIONS")) {
        if ($si == CARRIER_IP || $si == "127.0.0.1" || $si == LISTEN_IP) {
            sl_send_reply(200, "OpenSIPS OK");
        } else {
            sl_send_reply(403, "Forbidden");
        }
        exit;
    }

    # In-dialog requests (ACK/BYE/CANCEL/Re-INVITE)
    if (has_totag()) {
        if (loose_route()) {
            if (!t_relay()) { sl_reply_error(); }
            exit;
        }
        if (is_method("ACK")) {
            if (t_check_trans()) { t_relay(); }
            exit;
        }
        sl_send_reply(404, "Not here");
        exit;
    }

    if (is_method("INVITE")) {
        # ---- leg 1: carrier -> Daily room (SIP dial-in) ----
        if ($si == CARRIER_IP) {
            xlog("L_INFO", "INBOUND $fU -> $rU ($ci) => Daily\n");
            record_route();
            $var(from2) = "sip:" + $fU + "@" + CARRIER_HOST;
            uac_replace_from("", $var(from2));
            $ru = DAILY_SIP_URI;
            if (!t_relay()) { sl_reply_error(); }
            exit;
        }

        # ---- leg 2: Daily dial-out -> carrier ----
        if ($rU != "") {
            xlog("L_INFO", "OUTBOUND $fU -> $rU from $si ($ci)\n");
            record_route();
            # carriers usually authenticate the trunk by the registered account,
            # not by the From user of the dial-out leg
            uac_replace_from("", "sip:" + TRUNK_USER + "@" + CARRIER_HOST);

            # Daily offers RTP/AVPF. Many carriers answer that with
            # "488 Not Acceptable Here" even though the codec itself is fine.
            # Rewriting the profile to RTP/AVP fixes the transfer leg.
            if (has_body("application/sdp")) {
                subst_body('/RTP\/AVPF/RTP\/AVP/g');
            }

            $ru = "sip:" + $rU + "@" + CARRIER_HOST + ":5060";
            $du = "sip:" + CARRIER_IP + ":5060";
            if (!t_relay()) { sl_reply_error(); }
            exit;
        }
    }

    sl_send_reply(405, "Method Not Allowed");
}
